name: Android build

on:
  pull_request:
  push:
    branches:
      - main
      - feature/alternativas-gratis-firebase
      - feature/votaciones-y-elecciones

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$sdkmanager_bin"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          "$sdkmanager_bin" "platforms;android-36" "build-tools;35.0.0"
      - name: Compile debug and run unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:bundleRelease :app:testDebugUnitTest --no-daemon
      - name: Java 21 for the host inference library
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run actual bundled chatbot inference
        run: ./gradlew :verificacion:run --no-daemon
      - name: Verify bundled models and licenses
        run: python3 tools/verificar_paquetes.py
      - name: Verify APK 16 KB alignment
        run: |
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$apk"
          done
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
      - name: Upload ready-to-install APK
        uses: actions/upload-artifact@v4
        with:
          name: app-lista-para-instalar
          compression-level: 0
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Play bundle with install-time models
        uses: actions/upload-artifact@v4
        with:
          name: bundle-play-con-modelos
          compression-level: 0
          path: app/build/outputs/bundle/release/app-release.aab
      - name: Upload Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: test-asistente-android
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
  android-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-lista-para-instalar
          path: paquetes
      - uses: actions/download-artifact@v4
        with:
          name: test-asistente-android
          path: paquetes
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual Android x86_64 native inference
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          ram-size: 3072M
          disk-size: 8G
          heap-size: 512M
          cores: 2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tools/probar_asistente_android.sh
      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-android-x86
          path: diagnostico/
          if-no-files-found: ignore
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install rules test tools
        run: npm --prefix tools/reglas install --no-audit --no-fund --ignore-scripts
      - name: Validate actual rules in Firestore emulator
        run: tools/reglas/node_modules/.bin/firebase emulators:exec --only firestore --project demo-votaciones-pruebas "node --test --test-concurrency=1 tools/reglas/pruebas.mjs"
